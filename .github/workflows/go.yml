name: Go
on: [push, pull_request]
jobs:

  build:
    name: Build/Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        go-version: ['1.25.x', 'stable']
        os: [ubuntu-latest]

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./... --timeout 60s

    - name: Simulator integration test
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev
        go test -tags tpmsim -v ./tpm/... --timeout 120s

    - name: Cross test for i386
      run: env GOOS=linux GOARCH=386 go test -v ./... --timeout 60s

    - name: Cross compile for arm (RPI)
      run: env GOOS=linux GOARCH=arm GOARM=5 go build -v ./...
